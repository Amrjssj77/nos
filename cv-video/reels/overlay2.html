<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;font-weight:400;src:url(../fonts/poppins-latin-400-normal.woff2)}
@font-face{font-family:P;font-weight:600;src:url(../fonts/poppins-latin-600-normal.woff2)}
@font-face{font-family:P;font-weight:800;src:url(../fonts/poppins-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:400;src:url(../fonts/jetbrains-mono-latin-400-normal.woff2)}
:root{--bg:#0c0c0f;--card:#15151b;--line:#2a2a31;--ink:#f3f1ea;--mut:#8d8d96;--lime:#c8ff2e;--pur:#8b7cff}
*{box-sizing:border-box;margin:0}html,body{width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:P,sans-serif;color:var(--ink)}
.mono{font-family:M,monospace;letter-spacing:.16em;text-transform:uppercase}
.abs{position:absolute}
#title,#end{inset:0;background:var(--bg);opacity:0;padding:110px 80px}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:120px 120px;opacity:.18}
#hud{inset:0;opacity:0}
#scrimT{left:0;right:0;top:0;height:380px;background:linear-gradient(#000a,#0000)}
#scrimB{left:0;right:0;bottom:120px;height:620px;background:linear-gradient(#0000,#000c)}
.pill{border:2px solid var(--lime);color:var(--lime);border-radius:99px;padding:14px 28px;font-size:26px;background:#0c0c0fcc}
#bar{left:0;right:0;bottom:0;height:120px;background:var(--lime);color:#0c0c0f;display:flex;align-items:center;justify-content:space-between;padding:0 80px;font-weight:800;font-size:30px;opacity:0}
#bar span:last-child{font-family:M;font-weight:400;font-size:26px}
#wipe{inset:0;background:var(--lime);transform:translateY(100%)}
#flash{inset:0;background:#fff;opacity:0}
.seg{position:absolute;top:60px;height:8px;border-radius:4px;background:#ffffff40;overflow:hidden}.seg i{display:block;height:100%;width:0;background:var(--lime)}
</style></head><body>
<div id="bar" class="abs"><span>MOTION / CGI / 3D / SAAS / WEB</span><span>www.amroismat.online</span></div>
<div id="hud" class="abs"><div id="scrimT" class="abs"></div><div id="scrimB" class="abs"></div>
 <div class="abs pill mono" style="left:80px;top:110px">Amro Ismat</div>
 <div id="sec" class="abs mono" style="right:80px;top:128px;font-size:28px"></div>
 <div class="abs" style="left:80px;bottom:180px;right:80px"><div id="ctype" class="mono" style="color:var(--lime);font-size:30px"></div><div id="cname" style="font-weight:800;font-size:110px;letter-spacing:-.03em;margin-top:12px;line-height:1"></div></div>
 <div id="dim" class="abs" style="inset:0;background:#0c0c0f;opacity:0"></div>
 <div id="more" class="abs mono" style="left:80px;right:80px;top:880px;text-align:center;color:var(--lime);font-size:34px;line-height:1.8;opacity:0">FULL PIECE<br>IN THE PORTFOLIO ↗</div>
</div>
<div id="title" class="abs"><div class="grid"></div>
 <svg class="abs" id="tring" width="1000" height="1000" viewBox="0 0 900 900" style="right:-380px;top:760px"><circle cx="450" cy="450" r="400" fill="none" stroke="#2a2a31" stroke-width="2"/><circle cx="450" cy="450" r="300" fill="none" stroke="#8b7cff" stroke-width="110"/><circle cx="450" cy="450" r="360" fill="none" stroke="#f3f1ea" stroke-width="4" stroke-dasharray="1 18" stroke-linecap="round"/></svg>
 <div class="mono" style="color:var(--mut);font-size:28px;display:flex;justify-content:space-between"><span>Amro Ismat</span><span>2026</span></div>
 <div id="tnum" class="mono abs" style="left:80px;top:600px;color:var(--lime);font-size:40px"></div>
 <div id="tword" class="abs" style="left:80px;top:680px;width:920px;font-weight:800;font-size:170px;letter-spacing:-.04em;line-height:.95"></div>
 <div id="tsub" class="abs mono" style="left:80px;top:1120px;font-size:30px;color:var(--lime)"></div>
</div>
<div id="info" class="abs" style="inset:0;background:var(--bg);opacity:0;padding:110px 80px"><div class="grid"></div>
 <div class="mono" style="color:var(--lime);font-size:28px">About this work</div>
 <div id="iname" style="font-weight:800;font-size:120px;letter-spacing:-.03em;margin-top:24px;line-height:1"></div>
 <div id="idesc" style="font-size:54px;line-height:1.3;margin-top:44px;color:var(--ink);font-weight:400"></div>
 <div class="mono" style="color:var(--pur);font-size:28px;margin-top:100px;margin-bottom:34px">How it's made</div>
 <div id="steps"></div>
</div>
<div id="end" class="abs"><div class="grid"></div>
 <div class="mono abs" style="left:80px;top:420px;color:var(--lime);font-size:32px">Want the full piece?</div>
 <div id="eh" class="abs" style="left:80px;top:500px;width:920px;font-weight:800;font-size:150px;letter-spacing:-.04em;line-height:.98">It's waiting in the <span style="color:var(--lime)">portfolio.</span></div>
 <div id="earr" class="abs" style="right:80px;top:1230px;width:190px;height:190px;border-radius:50%;background:var(--lime);display:grid;place-items:center"><svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#0c0c0f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg></div>
 <div id="eu" class="abs" style="left:80px;top:1130px;font-weight:800;font-size:64px;letter-spacing:-.02em">www.amroismat.online</div>
 <div id="ec" class="abs mono" style="left:80px;top:1330px;font-size:28px;color:var(--mut);line-height:2.1">Info@amroismat.online<br>01500400025</div>
</div>
<div id="flash" class="abs"></div><div id="wipe" class="abs"></div>
<script>
const $=s=>document.querySelector(s);const ez=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;const eo=x=>1-Math.pow(1-x,4);const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
let C;
window.init=cfg=>{C=cfg;C.t1=1.2;C.t2=C.t1+cfg.clipd;C.t3=C.t2+4;C.tot=C.t3+2.5;
 $('#tnum').textContent='WORK '+cfg.num+' / '+cfg.total;$('#tword').textContent=cfg.name;if(cfg.fs)$('#tword').style.fontSize=cfg.fs+'px';$('#tsub').textContent=cfg.type;
 $('#sec').textContent=cfg.cat;$('#ctype').textContent=cfg.type;$('#cname').textContent=cfg.name;$('#iname').textContent=cfg.name;$('#idesc').textContent=cfg.desc;
 cfg.steps.forEach((s,i)=>{$('#steps').insertAdjacentHTML('beforeend',`<div class="st" style="display:flex;align-items:center;gap:30px;background:var(--card);border:2px solid var(--line);border-radius:30px;padding:28px 34px;margin-bottom:22px"><span class="mono" style="color:var(--lime);font-size:30px">0${i+1}</span><span style="font-size:42px;font-weight:600">${s}</span></div>`)});
 return C.tot};
window.seek=t=>{const {t1,t2,t3,tot}=C;
 const sh=(id,on)=>$(id).style.opacity=on?1:0;
 sh('#title',t<t1);sh('#hud',t>=t1&&t<t2);sh('#info',t>=t2&&t<t3);sh('#end',t>=t3);$('#bar').style.opacity=(t>=t3)?0:1;
 if(t<t1){const p=cl(t/.7);$('#tword').style.transform=`translateY(${(1-eo(p))*70}px)`;$('#tword').style.opacity=eo(p);$('#tnum').style.opacity=eo(cl((t-.1)/.4));$('#tsub').style.opacity=eo(cl((t-.5)/.4));$('#tring').style.transform=`rotate(${t*40}deg)`}
 if(t>=t1&&t<t2){const l=t-t1;$('#cname').style.opacity=eo(cl(l/.4));$('#cname').style.transform=`translateY(${(1-eo(cl(l/.4)))*40}px)`;
  const d=cl((l-(t2-t1-.9))/.6);$('#dim').style.opacity=d*.9;$('#more').style.opacity=cl((l-(t2-t1-.6))/.4)}
 if(t>=t2&&t<t3){const l=t-t2;$('#iname').style.opacity=eo(cl(l/.4));$('#idesc').style.opacity=eo(cl((l-.2)/.5));$('#idesc').style.transform=`translateY(${(1-eo(cl((l-.2)/.5)))*30}px)`;
  [...document.querySelectorAll('.st')].forEach((e,i)=>{const p=eo(cl((l-.8-i*.35)/.5));e.style.opacity=p;e.style.transform=`translateX(${(1-p)*-60}px)`})}
 if(t>=t3){const l=t-t3;$('#eh').style.opacity=eo(cl(l/.5));$('#eh').style.transform=`translateY(${(1-eo(cl(l/.6)))*60}px)`;$('#earr').style.transform=`scale(${ez(cl((l-.4)/.5))})`;$('#eu').style.opacity=eo(cl((l-.6)/.4));$('#ec').style.opacity=eo(cl((l-.9)/.4))}
 let y=100;for(const X of [t1,t2,t3]){if(t>=X-.3&&t<X)y=100-100*ez((t-(X-.3))/.3);else if(t>=X&&t<X+.4)y=-100*ez((t-X)/.4)}
 $('#wipe').style.transform=`translateY(${y}%)`;$('#flash').style.opacity=0};
</script></body></html>
