<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Freefall Cards Cascade</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,600;0,800;1,800&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#16161a; --panel:#efeff1; --ink:#0d0d10; --mut:#6b6b73; --accent1:#7a3cff; --accent2:#2f6bff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:var(--bg); font-family:'Inter Tight',system-ui,sans-serif; color:var(--ink); display:grid; place-items:center; padding:clamp(8px,2vw,24px); overflow:hidden; }

  /* frame */
  #frame { position:relative; width:min(1100px,100%); height:min(640px,calc(100svh - 24px)); background:var(--panel); border-radius:22px; overflow:hidden; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); touch-action:none; }
  #close { position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%; border:0; background:rgba(0,0,0,.08); color:var(--ink); font:400 18px/1 'Inter Tight',sans-serif; cursor:pointer; z-index:20; }
  #close:hover { background:rgba(0,0,0,.16); }

  /* copy */
  #copy { align-self:center; padding:0 clamp(24px,5vw,64px); }
  #copy .eyebrow { font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--mut); margin-bottom:14px; }
  #copy h1 { font-weight:800; font-size:clamp(44px,8vw,92px); line-height:.92; letter-spacing:-.04em; }
  #copy h1 em { display:block; font-style:italic; background:linear-gradient(90deg,var(--accent1),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; padding-right:.08em; }
  #copy p { margin-top:18px; max-width:26ch; font-size:13px; line-height:1.5; color:var(--mut); }
  #copy a { display:inline-flex; margin-top:22px; align-items:center; gap:8px; padding:10px 18px; border-radius:99px; background:var(--ink); color:#fff; font-size:12px; font-weight:600; text-decoration:none; }
  #copy a:focus-visible { outline:2px solid var(--accent2); outline-offset:3px; }

  /* stack */
  #stage { position:relative; overflow:hidden; }
  #deck { position:absolute; inset:0; perspective:900px; perspective-origin:50% 40%; }
  .card { position:absolute; left:50%; top:50%; width:var(--cw); height:var(--ch); margin:calc(var(--ch) / -2) 0 0 calc(var(--cw) / -2); border-radius:18px; overflow:hidden; background:#222; will-change:transform,opacity;
    box-shadow:0 18px 40px -12px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.18); }
  .card canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .card::after { content:""; position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,.55),transparent 45%); }
  .card .lab { position:absolute; top:12px; left:14px; z-index:2; font-size:8px; letter-spacing:.24em; text-transform:uppercase; color:rgba(255,255,255,.8); }
  .card .nm { position:absolute; left:14px; bottom:14px; right:14px; z-index:2; color:#fff; font-weight:800; font-size:clamp(15px,2vw,20px); letter-spacing:-.02em; }
  .card .nm small { display:block; font-weight:400; font-size:9px; letter-spacing:0; opacity:.75; margin-top:2px; }

  /* counter */
  #count { position:absolute; right:clamp(16px,4vw,40px); top:34%; z-index:10; display:flex; flex-direction:column; align-items:flex-end; gap:10px; pointer-events:none; }
  #num { font-weight:800; font-size:22px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  #track { position:relative; width:2px; height:clamp(90px,20vh,150px); background:rgba(0,0,0,.14); border-radius:2px; }
  #fill { position:absolute; left:0; top:0; width:2px; background:linear-gradient(var(--accent1),var(--accent2)); border-radius:2px; height:0; }
  #dot { position:absolute; left:-3px; width:8px; height:8px; border-radius:50%; background:var(--accent2); top:0; margin-top:-4px; box-shadow:0 0 0 4px rgba(47,107,255,.18); }
  #hint { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--mut); z-index:10; pointer-events:none; transition:opacity .5s; }

  @media (max-width:720px) {
    #frame { grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); height:min(720px,calc(100svh - 16px)); }
    #copy { padding:44px 24px 0; align-self:start; }
    #copy h1 { font-size:clamp(40px,14vw,64px); } #copy p { display:none; } #copy a { margin-top:14px; }
    #count { top:12px; right:18px; flex-direction:row; align-items:center; } #track { display:none; }
  }
  @media (prefers-reduced-motion:reduce) { .card { transition:none; } }
</style>
</head>
<body>
<main id="frame" aria-label="Freefall cards cascade">
  <button id="close" type="button" aria-label="Back to first card">×</button>
  <section id="copy">
    <div class="eyebrow">Cards · Cascade</div>
    <h1>In <em>Freefall</em></h1>
    <p>Eleven abstract images caught mid-drop. Scroll and watch them cascade into the stack.</p>
    <a href="#" id="cta">Explore the deck <span aria-hidden="true">↗</span></a>
  </section>
  <section id="stage" aria-live="polite">
    <div id="deck"></div>
    <div id="count"><span id="num">01</span><div id="track"><i id="fill"></i><i id="dot"></i></div></div>
    <div id="hint">Scroll</div>
  </section>
</main>

<script>
/* ---------- data: one abstract image per card, drawn on canvas (no assets) ---------- */
const CARDS = [
  { name:'Plume',     tag:'Gradient',  pal:['#ff4d8d','#ff9a3c','#ffd27a','#7b2cff'], style:'ribbons' },
  { name:'Chapel',    tag:'Glass',     pal:['#ff3b30','#ff8a00','#2f6bff','#ffd0a6'], style:'ribbons' },
  { name:'Lantern',   tag:'Light',     pal:['#16ff9a','#00d1ff','#ff2bd6','#0a0a12'], style:'rays' },
  { name:'Frond',     tag:'Organic',   pal:['#1aff5e','#7a3cff','#0a0a12','#e9ff7a'], style:'rays' },
  { name:'Veil',      tag:'Silk',      pal:['#00c2b8','#7a3cff','#e8fffb','#0b1b2b'], style:'ribbons' },
  { name:'Tidepool',  tag:'Marble',    pal:['#ffd60a','#1b3cff','#00b3ff','#101018'], style:'marble' },
  { name:'Dahlia',    tag:'Bloom',     pal:['#ff0f4d','#ff3da5','#ffb300','#4a0a2a'], style:'bloom' },
  { name:'Delta',     tag:'Marble',    pal:['#2f6bff','#ff7a1a','#e8e8ff','#0a1030'], style:'marble' },
  { name:'Origami',   tag:'Facets',    pal:['#ff3b30','#ffd60a','#1fb2ff','#7a3cff','#18d17a'], style:'facets' },
  { name:'Nectar',    tag:'Liquid',    pal:['#ff2d2d','#ff7a1a','#ffc13a','#5a0a14'], style:'ribbons' },
  { name:'Kindling',  tag:'Heat',      pal:['#ff6a00','#ffb300','#ff2d2d','#2a0a05'], style:'tubes' },
];
const N = CARDS.length;
const two = n => String(n).padStart(2, '0');

let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function paint(cv, c) {
  const w = cv.width = 360, h = cv.height = 450, g = cv.getContext('2d'), P = c.pal;
  const bg = g.createLinearGradient(0, 0, w, h); bg.addColorStop(0, P[P.length - 1]); bg.addColorStop(1, P[0]); g.fillStyle = bg; g.fillRect(0, 0, w, h);
  g.lineCap = 'round';
  const pick = () => P[Math.floor(rnd() * (P.length - 1))];
  if (c.style === 'ribbons' || c.style === 'tubes') {
    for (let i = 0; i < 22; i++) {
      const y = rnd() * h, a = 30 + rnd() * 120;
      g.beginPath(); g.moveTo(-40, y);
      g.bezierCurveTo(w * .3, y - a, w * .6, y + a, w + 40, y + (rnd() - .5) * 160);
      g.strokeStyle = pick(); g.globalAlpha = .55 + rnd() * .4; g.lineWidth = c.style === 'tubes' ? 14 + rnd() * 26 : 6 + rnd() * 30;
      g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = c.style === 'tubes' ? 14 : 4; g.stroke();
    }
  } else if (c.style === 'rays') {
    g.translate(w / 2, h * .55);
    for (let i = 0; i < 70; i++) { const a = rnd() * Math.PI * 2, r = 120 + rnd() * 240;
      g.beginPath(); g.moveTo(Math.cos(a) * 12, Math.sin(a) * 12); g.quadraticCurveTo(Math.cos(a + .6) * r * .5, Math.sin(a + .6) * r * .5, Math.cos(a + .2) * r, Math.sin(a + .2) * r);
      g.strokeStyle = pick(); g.globalAlpha = .5 + rnd() * .5; g.lineWidth = 1 + rnd() * 5; g.stroke(); }
    g.setTransform(1, 0, 0, 1, 0, 0);
  } else if (c.style === 'marble') {
    for (let i = 0; i < 40; i++) { const x = rnd() * w, y = rnd() * h, r = 20 + rnd() * 90;
      const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, pick()); rg.addColorStop(1, 'rgba(0,0,0,0)');
      g.globalAlpha = .55 + rnd() * .4; g.fillStyle = rg; g.beginPath(); g.ellipse(x, y, r * (1 + rnd()), r * (.5 + rnd() * .6), rnd() * 3, 0, 7); g.fill(); }
    for (let i = 0; i < 14; i++) { g.beginPath(); g.moveTo(rnd() * w, 0); g.bezierCurveTo(rnd() * w, h * .3, rnd() * w, h * .7, rnd() * w, h); g.strokeStyle = 'rgba(255,255,255,.35)'; g.globalAlpha = 1; g.lineWidth = 1.5; g.stroke(); }
  } else if (c.style === 'bloom') {
    g.translate(w / 2, h * .5);
    for (let k = 0; k < 6; k++) for (let i = 0; i < 18; i++) { g.rotate(Math.PI * 2 / 18);
      g.beginPath(); g.ellipse(70 + k * 18, 0, 90 - k * 10, 20 + k * 3, 0, 0, 7); g.fillStyle = P[(i + k) % (P.length - 1)]; g.globalAlpha = .3; g.fill(); }
    g.setTransform(1, 0, 0, 1, 0, 0);
  } else if (c.style === 'facets') {
    for (let i = 0; i < 46; i++) { g.beginPath(); const x = rnd() * w, y = rnd() * h; g.moveTo(x, y); g.lineTo(x + (rnd() - .5) * 240, y + (rnd() - .5) * 240); g.lineTo(x + (rnd() - .5) * 240, y + (rnd() - .5) * 240); g.closePath();
      g.fillStyle = P[i % P.length]; g.globalAlpha = .75; g.fill(); }
  }
  g.globalAlpha = 1; g.shadowBlur = 0;
}

/* ---------- build ---------- */
const deck = document.getElementById('deck'), stage = document.getElementById('stage');
const els = CARDS.map((c, i) => {
  const el = document.createElement('article'); el.className = 'card';
  el.innerHTML = `<canvas></canvas><span class="lab">${two(i + 1)} · ${c.tag}</span><div class="nm">${c.name}<small>Abstract ${two(i + 1)} of ${two(N)}</small></div>`;
  paint(el.querySelector('canvas'), c); deck.appendChild(el); return el;
});

/* ---------- layout + cascade ---------- */
let CW = 240, CH = 300;
function size() {
  const w = stage.clientWidth, h = stage.clientHeight;
  CH = Math.min(h * 0.52, w * 0.62 * 1.25, 360); CW = CH / 1.25;
  deck.style.setProperty('--cw', CW + 'px'); deck.style.setProperty('--ch', CH + 'px');
  deck.style.perspective = Math.max(700, h * 1.4) + 'px';
}
addEventListener('resize', size); size();

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
let target = 0, cur = 0;

function place(d) {            // d = card index - current position; 0 is the card in focus
  if (d <= 0) {                // already fallen: they pile up behind and above, each showing a sliver
    const k = -d;
    return { y: -k * CH * 0.17 - (k > 0 ? CH * 0.02 : 0), s: Math.pow(0.935, k), r: clamp(k, 0, 1) * 10, o: clamp(1 - (k - 3.2) / 1.6), z: 100 - k };
  }
  const k = d;                 // still waiting below: drop in from beneath, tilted toward the viewer
  return { y: k * CH * 1.02, s: Math.max(0.78, 1 - k * 0.07), r: -clamp(k, 0, 1.4) * 14, o: clamp(1.6 - k * 0.5), z: 100 - k * 2 };
}
const fill = document.getElementById('fill'), dot = document.getElementById('dot'), num = document.getElementById('num'), track = document.getElementById('track');
function frame() {
  cur += (target - cur) * 0.12; if (Math.abs(target - cur) < 0.0004) cur = target;
  els.forEach((el, i) => {
    const p = place(i - cur);
    el.style.transform = `translateY(${p.y}px) scale(${p.s}) rotateX(${p.r}deg)`;
    el.style.opacity = p.o; el.style.zIndex = Math.round(p.z * 10); el.style.visibility = p.o < 0.01 ? 'hidden' : 'visible';
    el.style.filter = i - cur < 0 ? `brightness(${clamp(1 + (i - cur) * 0.07, 0.6, 1)})` : 'none';
  });
  const t = cur / (N - 1), th = track.clientHeight;
  fill.style.height = (t * th) + 'px'; dot.style.top = (t * th) + 'px';
  num.textContent = two(Math.round(cur) + 1);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- input: wheel, touch/drag, keys ---------- */
let idle;
const go = v => { target = clamp(v, 0, N - 1); hint.style.opacity = 0; clearTimeout(idle); idle = setTimeout(() => { target = Math.round(target); }, 140); };
const hint = document.getElementById('hint');
document.getElementById('frame').addEventListener('wheel', e => { e.preventDefault(); go(target + e.deltaY * 0.0022); }, { passive: false });
let drag = null;
stage.addEventListener('pointerdown', e => { drag = { y: e.clientY, t: target }; stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => { if (drag) go(drag.t + (drag.y - e.clientY) / (CH * 0.9)); });
stage.addEventListener('pointerup', () => { drag = null; }); stage.addEventListener('pointercancel', () => { drag = null; });
addEventListener('keydown', e => { if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(Math.round(target) + 1); } if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); go(Math.round(target) - 1); } });
document.getElementById('close').addEventListener('click', () => go(0));
document.getElementById('cta').addEventListener('click', e => { e.preventDefault(); go(Math.round(target) + 1); });
</script>
</body>
</html>
