<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Made by</title>
<script src="gsap.min.js"></script>
<style>
  @font-face { font-family:"Inter"; font-weight:600; src:url(fonts/inter-latin-600-normal.woff2); }
  @font-face { font-family:"Inter"; font-weight:800; src:url(fonts/inter-latin-800-normal.woff2); }
  @font-face { font-family:"Mono"; font-weight:500; src:url(fonts/jetbrains-mono-latin-500-normal.woff2); }
  html,body { margin:0; background:#000; }
  #stage { position:relative; width:720px; height:1280px; overflow:hidden; background:linear-gradient(180deg,#0b0a0a 0%,#151210 46%,#0d0c0c 62%,#0a0a0a 100%); font-family:Inter,sans-serif; }
  #warm { position:absolute; inset:0; background:radial-gradient(60% 34% at 70% 30%, rgba(150,80,40,.28), transparent 70%); }
  #lap { position:absolute; left:0; top:0; width:720px; height:842px; perspective:1700px; perspective-origin:50% 38%;
         -webkit-box-reflect:below 0px linear-gradient(transparent 42%, rgba(255,255,255,.55)); }
  #laptop { position:absolute; inset:0; transform-style:preserve-3d; transform-origin:360px 700px; }
  #screenBox { position:absolute; left:50px; top:-258px; width:1320px; height:980px; transform-origin:0 100%; transform-style:preserve-3d;
        background:#050505; border-radius:34px; box-shadow:0 0 0 6px #17181b; }
  #viewport { position:absolute; left:20px; top:20px; width:1280px; height:940px; overflow:hidden; perspective:1100px; perspective-origin:50% 50%; background:#07080a; border-radius:10px; }
  #world { position:absolute; left:0; top:0; transform-origin:0 0; transform-style:preserve-3d; }
  #deck { position:absolute; left:20px; top:722px; width:680px; height:430px; transform-origin:50% 0; border-radius:16px;
        background:linear-gradient(180deg,#1b1c20,#0f1013); box-shadow:inset 0 0 0 2px #26282d; }
  #keys { position:absolute; left:34px; right:34px; top:34px; height:240px; border-radius:8px;
        background-image:linear-gradient(90deg,transparent 0 94%,#07080a 94%),linear-gradient(180deg,transparent 0 90%,#07080a 90%);
        background-size:40px 40px; background-color:#202228; box-shadow:0 0 22px rgba(60,120,255,.28) inset; }
  #pad { position:absolute; left:200px; right:200px; top:288px; height:100px; border-radius:10px; background:#15171b; box-shadow:inset 0 0 0 2px #25282e; }
  /* inner scene */
  .panel { position:absolute; background:#12141a; border:2px solid #272b34; border-radius:10px; overflow:hidden; }
  .ptitle { position:absolute; left:0; right:0; top:0; height:34px; background:#1a1d25; font:500 15px/34px Mono,monospace; color:#7b8394; padding-left:14px; }
  .bar { position:absolute; height:8px; border-radius:4px; background:#262b36; }
  .clip { position:absolute; height:44px; border-radius:6px; }
  #cube { position:absolute; left:0; top:0; width:0; height:0; transform-style:preserve-3d; }
  .face { position:absolute; width:104px; height:104px; left:-52px; top:-52px; border:2px solid rgba(60,18,6,.45); box-sizing:border-box; }
  #cap { position:absolute; left:140px; top:158px; transform-origin:0 0; transform:rotate(11deg); font:600 46px/1 Inter,sans-serif; color:#fff; white-space:nowrap; letter-spacing:-.01em; text-shadow:0 2px 12px rgba(0,0,0,.35); }
  #ast { position:absolute; left:70px; top:58px; width:215px; height:215px; }
  #vign { position:absolute; inset:0; background:radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.55)); pointer-events:none; }
</style>
</head>
<body>
<div id="stage" data-width="720" data-height="1280" data-duration="19">
  <div id="warm"></div>
  <div id="lap"><div id="laptop">
    <div id="deck"><div id="keys"></div><div id="pad"></div></div>
    <div id="screenBox"><div id="viewport"><div id="world"></div></div></div>
  </div></div>
  <svg id="ast" viewBox="-100 -100 200 200"></svg>
  <div id="cap">5.5 is insane at motion</div>
  <div id="vign"></div>
</div>
<script>
const D = 19, FPS = 30;
const TITLE = ["MADE BY", "AMRO ISMAT"];     // <- the sign-off
const CAPTION = "5.5 is insane at motion";
document.getElementById("cap").textContent = CAPTION;

/* ---------- helpers ---------- */
let seed = 11; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const lerp = (a,b,k) => a + (b-a)*k;
const ease = { io: k => k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2, out: k => 1-Math.pow(1-k,3), in: k => k*k*k,
               back: k => { const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2); }, lin: k => k };
const seg = (t,a,b,e="io") => ease[e](clamp((t-a)/(b-a)));
const el = (cls, css, parent, html) => { const d=document.createElement("div"); if(cls) d.className=cls; if(css) d.style.cssText=css; if(html) d.innerHTML=html; if(parent) parent.appendChild(d); return d; };
const world = document.getElementById("world");

/* ---------- asterisk + keys ---------- */
(function(){ const a=document.getElementById("ast"); let h="";
  for(let i=0;i<14;i++){ const r=i*360/14; h+=`<line x1="0" y1="-26" x2="0" y2="${-(78+(i%2?6:-6))}" stroke="#e0714e" stroke-width="15" stroke-linecap="round" transform="rotate(${r})"/>`; }
  a.innerHTML=h; })();

/* ---------- WORLD LAYOUT ----------
   W1 white canvas (0,0,1280,940)   PM program monitor (1500,0,1300,860)
   PROJ (-1560,0,1500,940)          SCOPE (1500,940,1300,860)   TL timeline (-1560,1010,3000,900) */
el("", "left:-4000px;top:-3000px;width:9000px;height:7000px;background:#0a0b0f;transform:translateZ(-60px)", world);

const W1 = el("panel","left:0;top:0;width:1280px;height:940px;background:#f4f6f8;border-color:#3a3f4a;transform:translateZ(0)",world);
W1.innerHTML = `<div class="ptitle" style="background:#e3e6ea;color:#7b8394">canvas — scene_01</div>
 <svg id="strokes" width="1280" height="940" style="position:absolute;left:0;top:0;overflow:visible"></svg>
 <svg id="petals" width="1280" height="940" style="position:absolute;left:0;top:0;overflow:visible"></svg>`;
const strokes = W1.querySelector("#strokes"), petals = W1.querySelector("#petals");
const legs = [];
for (let i=0;i<13;i++){ const a=i*27.7*Math.PI/180+.2, L=210+rnd()*330, cx=640, cy=450;
  const mx=cx+Math.cos(a)*L*.5+Math.sin(a)*(rnd()*90-45), my=cy+Math.sin(a)*L*.5+Math.cos(a)*(rnd()*90-45);
  const d=`M${cx} ${cy} Q${mx} ${my} ${cx+Math.cos(a)*L} ${cy+Math.sin(a)*L}`;
  const p=document.createElementNS("http://www.w3.org/2000/svg","path"); p.setAttribute("d",d); p.setAttribute("fill","none"); p.setAttribute("stroke","#15161a"); p.setAttribute("stroke-width","2"); p.setAttribute("stroke-linecap","round"); strokes.appendChild(p); legs.push(p); }
const blue=document.createElementNS("http://www.w3.org/2000/svg","path"); blue.setAttribute("d","M640 450 C 560 380 500 520 420 470 S 300 330 230 400 S 150 560 120 520"); blue.setAttribute("fill","none"); blue.setAttribute("stroke","#3b7cff"); blue.setAttribute("stroke-width","2.4"); blue.setAttribute("stroke-linecap","round"); strokes.appendChild(blue);
[...legs, blue].forEach(p => { p._len = p.getTotalLength(); p.style.strokeDasharray = p._len; });
let ph=""; for(let i=0;i<12;i++){ ph+=`<ellipse cx="0" cy="-170" rx="30" ry="120" fill="#f08a5d" opacity=".95" transform="rotate(${i*30}) translate(0,0)"/>`; }
petals.innerHTML = `<g id="pg" transform="translate(760 520)">${ph}</g>`;
const pg = petals.querySelector("#pg");

/* editor panels with ui noise */
function panel(x,y,w,h,title,dark=true){ const p=el("panel",`left:${x}px;top:${y}px;width:${w}px;height:${h}px`,world); el("ptitle","",p,title); return p; }
function noise(p,n,x0=18,y0=52,gap=22){ const w=parseFloat(p.style.width);
  for(let i=0;i<n;i++){ const c=rnd()<.12?"#2f6fd6":rnd()<.1?"#c8632f":"#262b36"; el("bar",`left:${x0+(rnd()<.3?24:0)}px;top:${y0+i*gap}px;width:${40+rnd()*(w*.55)}px;background:${c}`,p); } }
const PROJ = panel(-1560,0,1500,940,"project / bin"); noise(PROJ,34);
for(let i=0;i<8;i++) el("", `position:absolute;left:${900+(i%2)*280}px;top:${70+Math.floor(i/2)*200}px;width:240px;height:150px;border-radius:8px;background:linear-gradient(135deg,#1f2430,#2a3140)`,PROJ);
const SCOPE = panel(1500,940,1300,860,"scopes / effect controls"); noise(SCOPE,16,18,60,28);
SCOPE.insertAdjacentHTML("beforeend",`<svg width="760" height="320" style="position:absolute;left:480px;top:90px"><rect width="760" height="320" fill="#0b0c10" stroke="#2a2e38"/><path d="M0 300 L120 240 L200 270 L320 150 L420 190 L520 60 L640 120 L760 20" stroke="#e9ecf2" stroke-width="2" fill="none"/><path d="M0 310 L160 250 L300 285 L420 210 L560 120 L760 80" stroke="#3b7cff" stroke-width="2" fill="none"/></svg>`);

/* program monitor (the title graphic) */
const PM = panel(1500,0,1300,860,"program monitor");
const pmScreen = el("", "position:absolute;left:30px;top:50px;width:1240px;height:700px;background:radial-gradient(60% 70% at 50% 40%,#2a1307,#0b0705);overflow:hidden",PM);
let sp=""; for(let i=0;i<16;i++){ sp+=`<path d="M0 -40 Q 14 -120 0 -${150+(i%2)*40} Q -14 -120 0 -40Z" fill="#ffb27a" transform="rotate(${i*22.5})"/>`; }
const burst = el("", "position:absolute;left:520px;top:30px;width:200px;height:200px",pmScreen,`<svg id="bsvg" viewBox="-200 -200 400 400" width="200" height="200" style="overflow:visible"><g id="bg">${sp}</g></svg>`);
const sw1 = el("", "position:absolute;left:80px;top:60px;width:430px;height:76px;border-radius:40px;background:linear-gradient(90deg,#f8a577,#e8663c);transform:rotate(-8deg)",pmScreen);
const sw2 = el("", "position:absolute;left:760px;top:520px;width:400px;height:72px;border-radius:40px;background:linear-gradient(90deg,#e8663c,#f8a577);transform:rotate(-12deg)",pmScreen);
const t1 = el("", "position:absolute;left:0;width:1240px;top:230px;text-align:center;font:800 118px/1 Inter;color:#f2eee9;letter-spacing:.01em;transform:skewX(-6deg);text-shadow:0 0 30px rgba(255,120,60,.55)",pmScreen,TITLE[0]);
const t2 = el("", "position:absolute;left:0;width:1240px;top:355px;text-align:center;font:800 150px/1 Inter;color:#f2eee9;letter-spacing:.01em;transform:skewX(-6deg);text-shadow:0 0 36px rgba(255,120,60,.6)",pmScreen,TITLE[1]);
const shards = []; for(let i=0;i<70;i++){ const s=el("", `position:absolute;left:620px;top:350px;width:${10+rnd()*34}px;height:${6+rnd()*18}px;background:${rnd()<.5?'#f6a173':rnd()<.5?'#ffffff':'#7c8aa0'};clip-path:polygon(${rnd()*30}% 0,100% ${rnd()*40}%,${70+rnd()*30}% 100%,0 ${60+rnd()*40}%);opacity:0`,pmScreen);
  s._a=rnd()*Math.PI*2; s._v=140+rnd()*620; s._r=(rnd()-.5)*900; s._d=rnd()*.35; shards.push(s); }
el("", "position:absolute;left:30px;right:30px;bottom:18px;height:56px;border-radius:8px;background:#161922;font:500 14px/56px Mono;color:#6c7384;padding-left:18px",PM,"00:00:14:08    ▶  ◼  ◀◀  ▶▶    fit");

/* timeline */
const TL = panel(-1560,1010,3000,900,"timeline — sequence_01");
const track = ["#f2c230","#e8503a","#52b6ff","#2f6fe0","#4cc38a","#f2c230","#52b6ff"];
const clipsEl = el("", "position:absolute;left:0;top:50px;width:3000px;height:820px",TL);
track.forEach((c,i)=>{ let x=-200+rnd()*200; while(x<3200){ const w=140+rnd()*520; el("clip",`left:${x}px;top:${i*104+12}px;width:${w}px;background:${c};opacity:${.82+rnd()*.18};box-shadow:0 0 18px ${c}55`,clipsEl); x+=w+20+rnd()*60; } });
const head = el("", "position:absolute;top:34px;width:6px;height:860px;background:#a8dcff;box-shadow:0 0 24px 6px rgba(80,170,255,.8)",TL);
const head2 = el("", "position:absolute;top:34px;width:6px;height:860px;background:#7fb8ff;box-shadow:0 0 24px 6px rgba(60,140,255,.7)",TL);

/* cube mascot */
const cube = el("", "", world); cube.id="cube";
[["rotateY(0deg)","#ee6c3b"],["rotateY(90deg)","#d9552b"],["rotateY(180deg)","#c9481f"],["rotateY(-90deg)","#f27d4f"],["rotateX(90deg)","#ff9a6e"],["rotateX(-90deg)","#b83f19"]]
  .forEach(([r,c])=>el("face",`transform:${r} translateZ(52px);background:${c}`,cube));
const shadow = el("", "position:absolute;width:60px;height:22px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(5px);margin:-11px 0 0 -30px",world);

/* ---------- camera + cube choreography ---------- */
const CAM = [ // t, cx, cy, dz, rx, ry, rz
 [0.0, 640,470, 40, 30, 20, 0],
 [1.4, 600,450, 80, 24, 10, 0],
 [2.1, 760,520, 20, 26,-22, 4],
 [2.55,1500,520,-420, 42,-34,-7],
 [3.1, 700,470, 10, 24, 16, 0],
 [4.0, 720,480,-120, 28, 14, 0],
 [4.7, -250,700,-420, 40, 28, 9],
 [5.7, 1700,480,-420, 36,-22,-4],
 [7.4, 2150,560,-260, 30,-26,-3],
 [8.3,  650,1480,-220, 56, 12, 3],
 [10.5,1000,1480,-110, 62,  2,-3],
 [12.6,1500,1470,-140, 60,-10, 4],
 [13.6,1350,1000,-520, 44,-12, 0],
 [14.6,2150,470,-300, 28,-20, 0],
 [15.7,2150,430,  40, 8, -3, 0],
 [17.0,2150,430,  80, 3, -1, 0],
 [19.0,2150,430, 120, 1,  0, 0] ];
function camAt(t){ let i=0; while(i<CAM.length-2 && t>CAM[i+1][0]) i++;
  const a=CAM[i], b=CAM[i+1], k=ease.io(clamp((t-a[0])/(b[0]-a[0])));
  return { cx:lerp(a[1],b[1],k), cy:lerp(a[2],b[2],k), dz:lerp(a[3],b[3],k), rx:lerp(a[4],b[4],k), ry:lerp(a[5],b[5],k), rz:lerp(a[6],b[6],k) }; }
const CUBE = [ // t, x, y, z, spin, bob
 [0.0, 640,450, 34, 10],[1.4, 470,470,34, 80],[2.2, 900,500,60, 160],[3.0, 700,470,34,200],[3.6,760,470,120,260],
 [4.1, 900,470,40,300],[4.9,-100,700,50,400],[5.7,1700,420,60,480],[7.2,2100,500,70,560],[8.1, 380,1360,90,640],
 [10.5,1000,1360,90,720],[12.5,1500,1360,90,800],[13.5,1500,1360,90,840],[14.6,2000,380,90,920],[16.0,2150,760,60,1000],[19,2150,760,60,1040] ];
function cubeAt(t){ let i=0; while(i<CUBE.length-2 && t>CUBE[i+1][0]) i++; const a=CUBE[i], b=CUBE[i+1], k=ease.io(clamp((t-a[0])/(b[0]-a[0])));
  return { x:lerp(a[1],b[1],k), y:lerp(a[2],b[2],k), z:lerp(a[3],b[3],k), s:lerp(a[4],b[4],k) }; }

/* outer camera (the phone orbiting the laptop) */
function outerAt(t){ const w = Math.sin(t*.55)*7, whip = Math.sin(t*1.7)*3;
  return { ry:-17 + w + whip, rx:-2 + Math.sin(t*.4)*1.5, tx:Math.sin(t*.5)*10, tz: 0 }; }

const lap = document.getElementById("laptop"), screenBox = document.getElementById("screenBox"), deck = document.getElementById("deck");
const keys = document.getElementById("keys"), vp = document.getElementById("viewport");
const capEl = document.getElementById("cap"), astEl = document.getElementById("ast");

function frame(t){
  const c = camAt(t), c0 = camAt(Math.max(0,t-1/FPS));
  const speed = Math.abs(c.cx-c0.cx)*.05 + Math.abs(c.cy-c0.cy)*.05 + Math.abs(c.dz-c0.dz)*.06 + (Math.abs(c.rx-c0.rx)+Math.abs(c.ry-c0.ry)+Math.abs(c.rz-c0.rz))*.8;
  world.style.transform = `translate3d(640px,470px,${c.dz}px) rotateX(${c.rx}deg) rotateY(${c.ry}deg) rotateZ(${c.rz}deg) translate3d(${-c.cx}px,${-c.cy}px,0)`;
  vp.style.filter = speed>.8 ? `blur(${Math.min(9,speed*.6).toFixed(1)}px)` : "none";
  // laptop shell
  const o = outerAt(t);
  lap.style.transform = `translateX(${o.tx}px) rotateY(${o.ry}deg) rotateX(${o.rx}deg)`;
  screenBox.style.transform = `rotateX(-9deg) scale(.47)`;
  deck.style.transform = `rotateX(79deg)`;
  // strokes
  const p1 = seg(t,.1,1.5,"out"); legs.forEach((p,i)=>{ p.style.strokeDashoffset = p._len*(1-clamp(p1*1.2-i*.02)); });
  blue.style.strokeDashoffset = blue._len*(1-seg(t,.9,2.2,"out"));
  const ps = seg(t,3.15,3.9,"back"); pg.setAttribute("transform",`translate(760 520) rotate(${t*14}) scale(${ps})`);
  // cube
  const q = cubeAt(t), bob = Math.abs(Math.sin(t*5.2))*(t>8?26:14);
  cube.style.transform = `translate3d(${q.x}px,${q.y}px,${q.z+bob}px) rotateX(${-60+Math.sin(t*1.8)*12}deg) rotateY(${q.s}deg) rotateZ(${Math.sin(t*2.3)*10}deg)`;
  shadow.style.transform = `translate3d(${q.x}px,${q.y+34}px,${Math.max(0,q.z-40)}px)`;
  // timeline motion
  const hx = lerp(500,2300,clamp((t-7.8)/6.5)); head.style.left = hx+"px"; head2.style.left = (hx+ -90 + Math.sin(t*3)*14)+"px";
  head.style.opacity = head2.style.opacity = t>7 ? 1 : .0;
  clipsEl.style.transform = `translateX(${-t*38}px)`;
  // program monitor
  document.getElementById("bg").setAttribute("transform",`rotate(${t*18})`);
  sw1.style.transform = `translateX(${Math.sin(t*1.1)*40}px) rotate(-8deg)`; sw2.style.transform = `translateX(${-Math.sin(t*1.0)*40}px) rotate(-12deg)`;
  const rev = seg(t,13.4,14.5,"out"), fin = seg(t,15.4,16.6,"back");
  const tOp = t<13.4 ? 0.55 : 1; t1.style.opacity = t2.style.opacity = tOp;
  const sc = lerp(.96,1,rev) * (t>15.4 ? lerp(1,1.04,fin) : 1);
  t1.style.transform = `skewX(-6deg) scale(${sc})`; t2.style.transform = `skewX(-6deg) scale(${sc})`;
  const ex = clamp((t-16.2)/2.6);
  shards.forEach(s=>{ const k=clamp((t-16.2-s._d)/2.4); const e=ease.out(k);
    s.style.opacity = k>0 ? (1-ex*.8)*Math.min(1,k*8) : 0;
    s.style.transform = `translate(${Math.cos(s._a)*s._v*e}px,${Math.sin(s._a)*s._v*e*.7}px) rotate(${s._r*e}deg)`; });
  // overlay
  astEl.style.transform = `rotate(${-4+Math.sin(t*.8)*2}deg)`;
}
window.__frame = frame;

/* ---------- master timeline so renderer can seek ---------- */
const master = gsap.timeline({ paused:true }), px = { t:0 };
master.to(px,{ t:D, duration:D, ease:"none", onUpdate(){ frame(px.t); } },0);
master.duration(D); frame(0);
window.__tl = master;
const q = new URLSearchParams(location.search).get("t"); if (q !== null) master.seek(parseFloat(q));
</script>
</body>
</html>
