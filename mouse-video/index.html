<!doctype html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mouse Video</title>
<style>
  :root{--bg:#0e0e0e;--fg:#f2f2f2;--mut:#8a8a8a;--panel:min(34vw,520px)}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;overflow:hidden;cursor:crosshair}
  main{height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 6vw;max-width:calc(100% - var(--panel))}
  h1{font-size:clamp(2.4rem,6vw,6rem);line-height:1;letter-spacing:-.03em}
  p{margin-top:1.2rem;color:var(--mut);max-width:34ch}
  .bar{position:fixed;left:0;bottom:0;height:3px;width:100%;background:#222}
  .bar i{display:block;height:100%;width:0;background:var(--fg)}
  /* video pinned to the right edge */
  .side{position:fixed;top:0;right:0;height:100%;width:var(--panel);overflow:hidden;background:#000}
  .side video{width:100%;height:100%;object-fit:cover;display:block}
  .hint{position:absolute;left:1rem;bottom:1.2rem;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:#fff;mix-blend-mode:difference;transition:opacity .4s}
  @media(max-width:700px){:root{--panel:42vw}main{padding:0 5vw}}
</style>
</head>
<body>
<main>
  <h1>Move right.</h1>
  <p>حرّك الماوس ناحية اليمين والفيديو يشتغل. ولما تحركه شمال أو تخرجه برا الصفحة الفيديو يرجع لورا.</p>
</main>

<aside class="side">
  <video id="v" src="man.mp4" muted playsinline preload="auto"></video>
  <span class="hint" id="hint">→ move right</span>
</aside>
<div class="bar"><i id="fill"></i></div>

<script>
(() => {
  const v = document.getElementById('v');
  const fill = document.getElementById('fill');
  const hint = document.getElementById('hint');
  const SENS = 1.4;          // video seconds per full screen-width of rightward movement
  const BACK = 3;            // rewind is 3x faster than forward
  let dur = 0, target = 0, cur = 0, lastX = null;

  v.addEventListener('loadedmetadata', () => { dur = v.duration; });
  if (v.readyState >= 1) dur = v.duration;

  // rightward motion plays, leftward motion rewinds
  addEventListener('mousemove', e => {
    if (lastX !== null) {
      const dx = e.clientX - lastX;
      if (dur) {
        // right = forward, left = rewind
        target = Math.max(0, Math.min(dur - 0.04, target + (dx / innerWidth) * dur * SENS * (dx < 0 ? BACK : 1)));
        if (dx > 0) hint.style.opacity = 0;
      }
    }
    lastX = e.clientX;
  });
  addEventListener('mouseleave', () => { lastX = null; target = 0; hint.style.opacity = 1; });  // mouse left the page: rewind

  // touch: swipe right plays, swipe left rewinds
  addEventListener('touchmove', e => {
    const x = e.touches[0].clientX;
    if (lastX !== null && dur)
      target = Math.max(0, Math.min(dur - 0.04, target + ((x - lastX) / innerWidth) * dur * SENS * (x < lastX ? BACK : 1)));
    lastX = x;
  }, {passive:true});
  addEventListener('touchend', () => { lastX = null; });

  (function tick() {
    cur += (target - cur) * (target < cur ? 0.35 : 0.12);   // faster easing when rewinding
    if (Math.abs(target - cur) < 0.001) cur = target;
    if (dur && Math.abs(v.currentTime - cur) > 0.01) v.currentTime = cur;
    fill.style.width = dur ? (cur / dur * 100) + '%' : 0;
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
