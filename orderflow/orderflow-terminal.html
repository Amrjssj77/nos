<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orderflow Terminal</title>
<style>
:root{--bg:#0a0d12;--panel:#0f131a;--line:#1d2330;--txt:#c9d1dc;--dim:#6e7b91;--up:#2ebd85;--dn:#f6465d;--acc:#f0b90b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:12.5px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:var(--txt);background:#161b24;border:1px solid var(--line);border-radius:4px;padding:4px 9px}
button{cursor:pointer}button:hover{background:#1d2431}
header{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.14em;color:var(--acc);margin-right:6px}.brand span{color:var(--dim);font-weight:400;margin-left:6px;letter-spacing:.05em}
#symIn{width:92px;text-transform:uppercase;font-weight:700}
.seg{display:flex}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:4px 0 0 4px;margin-left:0}.seg button:last-child{border-radius:0 4px 4px 0}
.seg button.on{background:#27324a;color:#fff;border-color:#3a4a6c}
.sel{display:flex;gap:5px;align-items:center;color:var(--dim)}.sel select{padding:3px 4px}
.grow{flex:1}
#feedTag{color:var(--acc);border:1px solid #4d4012;padding:2px 8px;border-radius:10px;font-size:11px;letter-spacing:.08em}
#clock{color:var(--dim);font-variant-numeric:tabular-nums;min-width:150px;text-align:right}
.menu{position:relative}.drop{display:none;position:absolute;top:100%;left:0;z-index:20;background:#121720;border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:230px;max-height:70vh;overflow:auto;box-shadow:0 8px 24px #000a}
.drop.open{display:block}.drop h4{margin:8px 0 4px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.drop h4:first-child{margin-top:0}
.drop label{display:flex;gap:7px;align-items:center;padding:2px 0;cursor:pointer;white-space:nowrap}
main{flex:1;display:grid;grid-template-columns:230px 1fr 300px;min-height:0}
aside{background:var(--panel);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
#right{border-right:0;border-left:1px solid var(--line)}
.ph{padding:6px 10px;color:var(--dim);text-transform:uppercase;font-size:11px;letter-spacing:.08em;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:space-between}
.ph input{width:80px;padding:2px 6px;font-size:11px}
#wlist{overflow:auto;flex:1}
.grp{padding:5px 10px;color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;background:#0c1017;position:sticky;top:0}
.wr>div{min-width:0}.wr{display:grid;grid-template-columns:minmax(0,1fr) auto 58px;gap:6px;padding:4px 10px;cursor:pointer;border-bottom:1px solid #121720;font-variant-numeric:tabular-nums}
.wr:hover{background:#151b26}.wr.on{background:#1b2536;box-shadow:inset 2px 0 var(--acc)}
.wr b{font-weight:600}.wr small{color:var(--dim);display:block;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:95px}
.up{color:var(--up)}.dn{color:var(--dn)}
#chartWrap{position:relative;min-width:0;min-height:0}#chart{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
#dom{font:11.5px ui-monospace,Menlo,Consolas,monospace;flex:0 0 auto}
.dr{display:grid;grid-template-columns:62px 1fr 60px 1fr 56px;align-items:center;height:17px;position:relative}
.dr>div{padding:0 5px;position:relative;z-index:1;white-space:nowrap;overflow:hidden}
.dr .bar{position:absolute;top:1px;bottom:1px;z-index:0;opacity:.35}
.dr .bidc{text-align:right}.dr .px{text-align:center;color:#e8ecf2}.dr .vc{text-align:right;color:var(--dim)}
.dr.ask .bar{background:var(--dn);left:50%}.dr.bid .bar{background:var(--up);right:50%}
.dr.spread{height:20px;white-space:nowrap;background:#161c28;color:var(--acc);justify-content:center;text-align:center;display:flex;align-items:center;font-size:11px}
.dr.wall .bidc,.dr.wall .askc{color:#fff;font-weight:700}
.dr .ib{position:absolute;right:0;top:0;bottom:0;width:3px;background:#5cc8ff;z-index:2}
.tabs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:6px 4px;color:var(--dim)}.tabs button.on{color:#fff;background:#1b2536;box-shadow:inset 0 -2px var(--acc)}
#tabBody{flex:1;overflow:auto;min-height:120px;font:11.5px ui-monospace,Menlo,Consolas,monospace}
.tr{display:grid;grid-template-columns:62px 1fr 62px;padding:1px 10px}.tr.big{font-weight:700;background:#1a2230}.tr span:last-child{text-align:right}
.sg{padding:5px 10px;border-bottom:1px solid #131822;font-family:system-ui}.sg small{color:var(--dim);margin-right:6px;font-family:ui-monospace,monospace}.sg i{font-style:normal;font-size:10px;border-radius:3px;padding:0 5px;margin-right:6px;background:#27324a}
.kv{display:grid;grid-template-columns:1fr auto;padding:3px 10px;border-bottom:1px solid #131822;font-family:system-ui}.kv span:first-child{color:var(--dim)}
footer{display:flex;padding:3px 10px;border-top:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:11px;gap:12px}
@media(max-width:1000px){main{grid-template-columns:1fr}aside{display:none}}
</style>
</head>

</main>

<script>
/* Order-flow simulator: a limit order book with persistent walls, icebergs,
   sweeps and a mean-reverting aggressor-pressure process. It emits trade
   prints {t,p,k,s,side,dq}: k = integer tick index, side +1 buy / -1 sell,
   dq = displayed size at the level before the print. */
(function (G) {
  const rnd = Math.random;
  function randn() { let u = 0; while (!u) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd()); }

  function Sim(inst, startPrice, t0) {
    this.inst = inst;
    this.D = Math.max(48, inst.cluster * 18);
    const D = this.D;
    this.bb = Math.round(startPrice / inst.tick);
    this.bid = new Float64Array(D); this.ask = new Float64Array(D);
    this.bw = new Int32Array(D); this.aw = new Int32Array(D); // wall lifetimes
    for (let i = 0; i < D; i++) { this.bid[i] = this.lvl(i, 1); this.ask[i] = this.lvl(i, -1); }
    this.iceA = {}; this.iceB = {};
    this.t = t0; this.nextT = t0; this.imb = 0; this.act = 1; this.burst = 0; this.burstSide = 1;
    this.ticks = []; this.snaps = []; this.lastSnap = t0;
    this.maxTicks = 450000; this.onTick = null;
    this.last = this.bb * inst.tick;
  }
  const P = Sim.prototype;
  P.base = function (i) { return this.inst.lot * this.inst.bk * (1 + i * 0.12); };
  P.lvl = function (i, sgn) {
    const t = Math.tanh(this.imb || 0) * 0.35 * sgn;
    return Math.max(1, Math.round(this.base(i) * Math.exp(0.5 * randn() - 0.1) * (1 + t)));
  };
  P.price = function (k) { return +(k * this.inst.tick).toFixed(this.inst.dec + 2); };
  P.bestBid = function () { return this.price(this.bb); };
  P.bestAsk = function () { return this.price(this.bb + 1); };

  P.emit = function (k, s, side, dq) {
    const tk = { t: this.t, p: this.price(k), k, s, side, dq };
    this.ticks.push(tk); this.last = tk.p;
    if (this.ticks.length > this.maxTicks) this.ticks.splice(0, 50000);
    if (this.onTick) this.onTick(tk);
  };
  P.shift = function (up) {
    const D = this.D;
    if (up) {
      this.bb++;
      this.ask.copyWithin(0, 1); this.aw.copyWithin(0, 1); this.ask[D - 1] = this.lvl(D - 1, -1); this.aw[D - 1] = 0;
      this.bid.copyWithin(1, 0); this.bw.copyWithin(1, 0); this.bid[0] = Math.max(1, Math.round(this.inst.lot * 1.5 * Math.exp(0.4 * randn()))); this.bw[0] = 0;
    } else {
      this.bb--;
      this.bid.copyWithin(0, 1); this.bw.copyWithin(0, 1); this.bid[D - 1] = this.lvl(D - 1, 1); this.bw[D - 1] = 0;
      this.ask.copyWithin(1, 0); this.aw.copyWithin(1, 0); this.ask[0] = Math.max(1, Math.round(this.inst.lot * 1.5 * Math.exp(0.4 * randn()))); this.aw[0] = 0;
    }
  };
  P.hit = function (side, size) {
    let rem = size, guard = 0;
    const lot = this.inst.lot;
    while (rem > 0 && guard++ < 60) {
      if (side > 0) {
        const k = this.bb + 1, lv = this.ask[0], take = Math.min(rem, lv);
        this.emit(k, take, 1, lv); this.ask[0] -= take; rem -= take;
        if (this.ask[0] < 1) {
          const h = this.iceA[k];
          if (h > 0) { const r = Math.min(h, Math.max(1, Math.round(lot * 1.5))); this.ask[0] = r; this.iceA[k] = h - r; if (h - r <= 0) delete this.iceA[k]; }
          else this.shift(true);
        }
      } else {
        const k = this.bb, lv = this.bid[0], take = Math.min(rem, lv);
        this.emit(k, take, -1, lv); this.bid[0] -= take; rem -= take;
        if (this.bid[0] < 1) {
          const h = this.iceB[k];
          if (h > 0) { const r = Math.min(h, Math.max(1, Math.round(lot * 1.5))); this.bid[0] = r; this.iceB[k] = h - r; if (h - r <= 0) delete this.iceB[k]; }
          else this.shift(false);
        }
      }
    }
  };
  P.refresh = function () {
    const D = this.D, lot = this.inst.lot;
    for (let n = 0; n < 4; n++) {
      const i = Math.floor(Math.pow(rnd(), 1.6) * D);
      if (this.bw[i] <= 0) this.bid[i] = this.lvl(i, 1); else this.bw[i]--;
      const j = Math.floor(Math.pow(rnd(), 1.6) * D);
      if (this.aw[j] <= 0) this.ask[j] = this.lvl(j, -1); else this.aw[j]--;
    }
    if (rnd() < 0.012) { // liquidity wall
      const i = 3 + Math.floor(rnd() * Math.min(20, D - 4)), m = 6 + rnd() * 8;
      if (rnd() < 0.5) { this.bid[i] = Math.round(this.base(i) * m); this.bw[i] = 150 + Math.floor(rnd() * 700); }
      else { this.ask[i] = Math.round(this.base(i) * m); this.aw[i] = 150 + Math.floor(rnd() * 700); }
    }
    if (rnd() < 0.004) { // hidden iceberg near the touch
      const d = Math.floor(rnd() * 3), hid = Math.round(lot * (20 + rnd() * 40));
      if (rnd() < 0.5) this.iceB[this.bb - d] = hid; else this.iceA[this.bb + 1 + d] = hid;
    }
  };
  P.event = function () {
    const lot = this.inst.lot;
    this.imb = this.imb * 0.997 + 0.07 * randn();
    this.act = Math.min(2.2, Math.max(0.35, this.act * 0.998 + 0.002 + 0.03 * randn() * 0.3));
    let side;
    if (this.burst > 0) { side = this.burstSide; this.burst--; }
    else side = rnd() < 0.5 + 0.2 * Math.tanh(this.imb) ? 1 : -1;
    let size = Math.max(1, Math.round(lot * Math.exp(0.9 * randn() - 0.4)));
    if (rnd() < 0.012) { size = Math.round(size * (6 + rnd() * 16)); this.burst = 2 + Math.floor(rnd() * 5); this.burstSide = side; }
    this.hit(side, size);
    this.refresh();
    const dt = -Math.log(1 - rnd()) / (this.inst.rate * this.act);
    this.nextT += dt * 1000;
  };
  P.snap = function () {
    if (this.t - this.lastSnap < 1000) return;
    this.lastSnap = this.t;
    const D = this.D;
    this.snaps.push({ t: this.t, bb: this.bb, bid: Float32Array.from(this.bid.subarray(0, D)), ask: Float32Array.from(this.ask.subarray(0, D)) });
    if (this.snaps.length > 30000) this.snaps.splice(0, 3000);
  };
  /* Advance the virtual clock to `until` (ms), emitting prints on the way. */
  P.advance = function (until) {
    while (this.nextT <= until) { this.t = this.nextT; this.event(); this.snap(); }

<script>
/* Massive (ex-Polygon) futures WebSocket adapter.
   Docs: wss://socket.massive.com/futures (real-time) / wss://delayed.massive.com/futures
   Auth {"action":"auth","params":KEY}; subscribe T.<ticker> (trades) + Q.<ticker> (BBO quotes).
   The feed has no aggressor flag, so side is inferred (quote rule, then tick rule). */
(function (G) {
  const MONTHS = [[3, 'H'], [6, 'M'], [9, 'U'], [12, 'Z']];
  /* Front quarterly contract, e.g. ESZ6. Rolls on the 15th of the expiry month. */
  function frontContract(root, now) {
    const d = new Date(now || Date.now()), m = d.getUTCMonth() + 1, day = d.getUTCDate();
    let y = d.getUTCFullYear();
    for (const [qm, code] of MONTHS) if (qm > m || (qm === m && day < 15)) return root + code + (y % 10);
    return root + 'H' + ((y + 1) % 10);
  }
  /* Instruments the Massive futures feed can serve (CME roots). */
  const ROOTS = { ES: 1, NQ: 1, YM: 1, RTY: 1, MES: 1, MNQ: 1, NKD: 1 };

  function MassiveFeed(o) {
    this.url = o.url; this.key = o.key; this.h = o; this.ws = null; this.authed = false;
    this.subs = []; this.pending = null; this.q = {}; this.last = {};
  }
  const P = MassiveFeed.prototype;
  P.connect = function () {
    this.h.onStatus('connecting', this.url);
    const ws = (this.ws = new WebSocket(this.url));
    ws.onopen = () => ws.send(JSON.stringify({ action: 'auth', params: this.key }));
    ws.onmessage = ev => {
      let arr; try { arr = JSON.parse(ev.data); } catch (e) { return; }
      (Array.isArray(arr) ? arr : [arr]).forEach(m => this.msg(m));
    };
    ws.onerror = () => this.h.onStatus('error', 'WebSocket error (network, CORS/CSP or bad URL)');
    ws.onclose = e => { this.authed = false; this.h.onStatus('closed', 'closed ' + (e && e.code || '')); };
  };
  P.msg = function (m) {
    if (m.ev === 'status') {
      if (m.status === 'auth_success') { this.authed = true; this.h.onStatus('authed', m.message); if (this.pending) this.subscribe(this.pending); }
      else if (m.status === 'auth_failed' || /fail|error|max_conn|not authorized/i.test(m.status + ' ' + m.message)) this.h.onStatus('error', m.status + ': ' + m.message);
      else this.h.onStatus('info', m.status + ': ' + m.message);
    } else if (m.ev === 'Q') {
      this.q[m.sym] = { bp: m.bp, bs: m.bs, ap: m.ap, as: m.as, t: m.t };
      this.h.onQuote && this.h.onQuote(m);
    } else if (m.ev === 'T') {
      const tk = this.classify(m); if (tk) this.h.onTrade(tk, m);
    }
  };
  /* Quote rule (at/through ask = buy, at/through bid = sell), else tick rule. */
  P.classify = function (m) {
    if (!(m.s > 0) || !isFinite(m.p)) return null;
    const q = this.q[m.sym], st = this.last[m.sym] || (this.last[m.sym] = { p: m.p, side: 1 });
    let side = 0, dq = m.s;
    if (q && q.ap && m.p >= q.ap) { side = 1; dq = q.as; }
    else if (q && q.bp && m.p <= q.bp) { side = -1; dq = q.bs; }
    else side = m.p > st.p ? 1 : m.p < st.p ? -1 : st.side;
    st.p = m.p; st.side = side;
    return { t: m.t, p: m.p, s: m.s, side, dq: dq || m.s };
  };
  P.send = function (o) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(o)); };
  P.subscribe = function (ticker) {
    this.pending = ticker; if (!this.authed) return;
    this.unsubscribe(); this.subs = ['T.' + ticker, 'Q.' + ticker];
    this.send({ action: 'subscribe', params: this.subs.join(',') });
  };
  P.unsubscribe = function () { if (this.subs.length) this.send({ action: 'unsubscribe', params: this.subs.join(',') }); this.subs = []; };
  P.close = function () { this.pending = null; try { this.ws && this.ws.close(); } catch (e) {} };

  G.MassiveFeed = MassiveFeed; G.MassiveRoots = ROOTS; G.frontContract = frontContract;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

        + kv('VWAP', b[last].vw.toFixed(d)) + (pr ? kv('Session POC', (pr.poc * m).toFixed(d)) + kv('Session VAH', ((pr.vah + 1) * m - inst.tick).toFixed(d)) + kv('Session VAL', (pr.val * m).toFixed(d)) : '')
        + kv('Regime', rg.lab[last] || '—', rg.lab[last] === 'TREND' ? 'up' : rg.lab[last] === 'CHOP' ? 'dn' : '') + kv('Efficiency ratio (20)', isNaN(rg.er[last]) ? '—' : rg.er[last].toFixed(2))
        + kv('Variance ratio (q=4)', isNaN(rg.vr[last]) ? '—' : rg.vr[last].toFixed(2)) + kv('Realised-vol percentile', isNaN(rg.rvp[last]) ? '—' : (rg.rvp[last] * 100).toFixed(0) + '%') + kv('ATR(14)', isNaN(ind.atr[last]) ? '—' : ind.atr[last].toFixed(d))
        + kv('Prints stored', eng.ticks.length.toLocaleString()) + kv('Timezone', inst.tz);
    }
    $('tabBody').innerHTML = h;
  }

  /* ---- live loop ---- */
  let lastReal = performance.now(), acc = 0;
  function loop() {
    const now = performance.now(), dtReal = now - lastReal; lastReal = now;
    const dt = dtReal * speed; simClock += dt;
    for (const k in sims) sims[k].advance(simClock);
    if (speed) chart && chart.invalidate();
    acc += dtReal; if (acc > 400) { stepQuotes(acc / 1000 * Math.max(1, speed)); updWatch(); renderDom(); if (tab !== 'sig') renderTab(); acc = 0; }
    $('clock').textContent = cur ? new Intl.DateTimeFormat('en-GB', { timeZone: cur.inst.tz, dateStyle: 'medium', timeStyle: 'medium', hour12: false }).format(new Date(cur.live ? Date.now() : simClock)) + ' ' + (cur.inst.tz === 'Asia/Tokyo' ? 'JST' : 'ET') : '';
    $('status').textContent = cur ? `${cur.inst.sym} · ${eng.bars.length} bars · ${eng.ticks.length.toLocaleString()} prints · ${Object.keys(sims).length} streams live` : '';
    requestAnimationFrame(loop);
  }


  /* ---- live Massive feed ---- */
  const live = { feed: null, authed: false, ticker: null, tickers: {} };
  function liveBook(inst) {
    const z = () => new Float64Array(64);
    return { live: true, inst, last: 0, D: 64, bid: z(), ask: z(), bb: 0, iceA: {}, iceB: {}, ticks: [], snaps: [], bq: null,
      book() { return { bb: this.bb, bid: this.bid, ask: this.ask, D: 64 }; },
      bestBid() { return this.bq ? this.bq.bp : this.last; }, bestAsk() { return this.bq ? this.bq.ap : this.last; } };
  }
  function tickerFor(inst) { return live.tickers[inst.sym] || frontContract(inst.sym); }
  function setMsg(t, bad) { $('dMsg').textContent = t; $('dMsg').style.color = bad ? 'var(--dn)' : 'var(--dim)'; }
  function setTag(t, live) { const f = $('feedTag'); f.textContent = t; f.style.color = live ? 'var(--up)' : 'var(--acc)'; f.style.borderColor = live ? '#14532f' : '#4d4012'; }
  function liveSub(inst) {
    const tkr = tickerFor(inst); live.ticker = tkr; live.feed.subscribe(tkr);
    setTag('LIVE · ' + tkr + (live.feed.url.indexOf('delayed') >= 0 ? ' · DELAYED' : ''), true);
    $('dAuto').textContent = 'auto: ' + frontContract(inst.sym);
  }
  function liveUnsub() { if (live.feed) live.feed.unsubscribe(); if (live.feed && live.authed) setTag('LIVE connected · ' + cur.inst.sym + ' simulated (not on futures feed)', false); else if (!live.feed) setTag('SIMULATED FEED', false); }
  function liveTrade(tk) {
    if (!cur || !cur.live) return;
    const inst = cur.inst, last = eng.ticks.length ? eng.ticks[eng.ticks.length - 1].t : 0;
    tk.t = Math.max(tk.t, last); tk.k = Math.round(tk.p / inst.tick); cur.last = tk.p;
    eng.ingest(tk); tapeAdd(tk);
  }
  function liveQuote(m) {
    if (!cur || !cur.live || m.sym !== live.ticker) return;
    const inst = cur.inst; cur.bq = m; cur.bb = Math.round(m.bp / inst.tick);
    cur.bid.fill(0); cur.ask.fill(0); cur.bid[0] = m.bs; cur.ask[0] = m.as; if (!cur.last) cur.last = (m.bp + m.ap) / 2;
  }
  function liveConnect() {
    const key = $('dKey').value.trim(); if (!key) return setMsg('Enter your Massive API key.', true);
    liveDisconnect(true);
    const url = $('dUrl').value.trim() || $('dFeed').value;
    if (store) try { store.setItem('of.feedUrl', $('dFeed').value); } catch (e) {}
    live.feed = new MassiveFeed({ url, key,
      onStatus: (s, msg) => {
        if (s === 'authed') { live.authed = true; setMsg('Authenticated. Trades + quotes stream for futures symbols (ES, NQ, YM, RTY, MES, MNQ, NKD).'); select(cur.inst.sym); }
        else if (s === 'error') { setMsg(msg, true); setTag('FEED ERROR', false); }
        else if (s === 'closed') { live.authed = false; if (live.feed) { setMsg('Disconnected (' + msg + ').', true); setTag('SIMULATED FEED', false); } }
        else setMsg(s + (msg ? ': ' + msg : ''));
      }, onTrade: liveTrade, onQuote: liveQuote });
    live.feed.connect();
  }
  function liveDisconnect(quiet) {
    if (live.feed) { const f = live.feed; live.feed = null; live.authed = false; f.close(); }
    if (!quiet) { setMsg('Disconnected. Back to simulated data.'); setTag('SIMULATED FEED', false); if (cur && cur.live) select(cur.inst.sym); }
  }
  $('dGo').onclick = liveConnect; $('dOff').onclick = () => liveDisconnect(false);
  $('dTicker').onchange = e => { const v = e.target.value.trim().toUpperCase(); if (cur) { if (v) live.tickers[cur.inst.sym] = v; else delete live.tickers[cur.inst.sym]; if (live.authed && cur.live) select(cur.inst.sym); } };
  $('dataBtn').onclick = ev => { ev.stopPropagation(); const m = $('dataMenu'), o = m.classList.contains('open'); document.querySelectorAll('.drop').forEach(d => d.classList.remove('open')); if (!o) m.classList.add('open'); };
  document.addEventListener('click', e => { if (e.target.closest('#dataMenu') || e.target.id === 'dataBtn') return; });
  window.OFLive = live;

  buildDom(); buildWatch();
  select(q.get('sym') || (store && store.getItem('of.sym')) || 'ES');
  if (q.get('tf')) { eng.setTF(+q.get('tf')); buildTF(); }
  requestAnimationFrame(loop);
})();
</script>
</body>
