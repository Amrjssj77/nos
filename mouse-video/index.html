<!doctype html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mouse Video</title>
<style>
  :root{--bg:#0e0e0e;--fg:#f2f2f2;--mut:#8a8a8a;--panel:min(34vw,520px);--bot:30vh}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;overflow:hidden;cursor:crosshair}
  main{height:calc(100% - var(--bot));display:flex;flex-direction:column;justify-content:center;padding:0 6vw;max-width:calc(100% - var(--panel))}
  h1{font-size:clamp(2.4rem,6vw,6rem);line-height:1;letter-spacing:-.03em}
  p{margin-top:1.2rem;color:var(--mut);max-width:34ch}
  .vid{position:fixed;overflow:hidden;background:#000}
  .vid video{width:100%;height:100%;object-fit:cover;display:block}
  .side{top:0;right:0;bottom:var(--bot);width:var(--panel)}   /* right edge */
  .bottom{left:0;right:0;bottom:0;height:var(--bot)}          /* bottom edge */
  .bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:#222}
  .bar i{display:block;height:100%;width:0;background:var(--fg)}
  .hint{position:absolute;left:1rem;bottom:1.2rem;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:#fff;mix-blend-mode:difference;transition:opacity .4s}
  @media(max-width:700px){:root{--panel:42vw;--bot:24vh}main{padding:0 5vw}}
</style>
</head>
<body>
<main>
  <h1>Move right.</h1>
  <p>حرّك الماوس ناحية اليمين والفيديوهات تشتغل. ولما تحركه شمال أو تخرجه برا الصفحة ترجع لورا.</p>
</main>

<aside class="vid side">
  <video src="man.mp4" muted playsinline preload="auto"></video>
  <span class="hint">→ move right</span>
  <div class="bar"><i></i></div>
</aside>

<section class="vid bottom">
  <video src="man2.mp4" muted playsinline preload="auto"></video>
  <div class="bar"><i></i></div>
</section>

<script>
(() => {
  const SENS = 1.4;          // video seconds per full screen-width of rightward movement
  const BACK = 3;            // rewind is 3x faster than forward
  const hint = document.querySelector('.hint');
  let lastX = null;

  const clips = [...document.querySelectorAll('.vid')].map(el => {
    const c = { v: el.querySelector('video'), fill: el.querySelector('.bar i'), dur: 0, target: 0, cur: 0 };
    c.v.addEventListener('loadedmetadata', () => { c.dur = c.v.duration; });
    if (c.v.readyState >= 1) c.dur = c.v.duration;
    return c;
  });

  function move(x) {
    if (lastX !== null) {
      const dx = x - lastX;
      for (const c of clips) if (c.dur)
        c.target = Math.max(0, Math.min(c.dur - 0.04, c.target + (dx / innerWidth) * c.dur * SENS * (dx < 0 ? BACK : 1)));
      if (dx > 0) hint.style.opacity = 0;
    }
    lastX = x;
  }
  function reset() { lastX = null; }

  addEventListener('mousemove', e => move(e.clientX));
  addEventListener('mouseleave', () => { reset(); clips.forEach(c => c.target = 0); hint.style.opacity = 1; });
  addEventListener('touchmove', e => move(e.touches[0].clientX), {passive:true});
  addEventListener('touchend', reset);

  (function tick() {
    for (const c of clips) {
      c.cur += (c.target - c.cur) * (c.target < c.cur ? 0.35 : 0.12);
      if (Math.abs(c.target - c.cur) < 0.001) c.cur = c.target;
      if (c.dur && Math.abs(c.v.currentTime - c.cur) > 0.01) c.v.currentTime = c.cur;
      c.fill.style.width = c.dur ? (c.cur / c.dur * 100) + '%' : 0;
    }
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
